spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/whatsapp-clone
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.postgreSQLDialect
  flyway:
    clean-disabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/master
  servlet:
    multipart:
      max-file-size: 50MB

  springdoc:
    default-produces-media-type: application/json

application:
  file:
    uploads:
      media-output-path: ./uploads

